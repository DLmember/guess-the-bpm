<header><div class="brand"><span class="brandmark" aria-hidden="true"><i></i><i></i><i></i><i></i></span> GUESS THE BPM</div><div class="topright"><label class="volume-label" for="volume">音量</label><input class="volume" id="volume" aria-label="音量" type="range" min="0" max="100" value="65"></div></header>
<main>
<section class="heading"><div><div class="eyebrow">RHYTHM / CHALLENGE</div><h1>猜测 BPM 挑战</h1><div class="intro"><p>听节奏，给出你的答案。</p><button class="info-button" id="info" aria-label="什么是 BPM" aria-haspopup="dialog">?</button></div></div><div class="range">TEMPO RANGE<strong>80 — 350</strong>BEATS PER MINUTE</div></section>
<h2 class="mode-label">选择模式</h2><div class="modes" role="radiogroup" aria-label="挑战类型">
<button class="mode" role="radio" aria-checked="true" data-mode="single"><div class="mode-top"><span class="mode-number">01</span><span>SINGLE</span><i class="radio"></i></div><h3>单次猜测</h3><p>播放 30 秒，猜测一次</p></button>
<button class="mode" role="radio" aria-checked="false" data-mode="four"><div class="mode-top"><span class="mode-number">04</span><span>SEQUENCE</span><i class="radio"></i></div><h3>四次猜测</h3><p>四个不同 BPM，每个 10 秒</p></button>

</div>
<div class="start-area" id="start-area"><button class="primary" id="start">开始挑战 →</button><p id="start-help" role="status"></p></div><section class="console hidden" id="console"><div><div class="console-head"><span class="status"><i class="dot"></i><span id="status" role="status">准备就绪</span></span><span id="round">ROUND — / —</span></div><div class="wave-wrap"><canvas id="wave" aria-label="波形与四拍节拍可视化"></canvas><div class="beat-flashes" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div><div class="transport"><strong id="time">30 秒</strong><span id="detail">单次猜测</span></div><div class="progress"><div id="progress"></div></div></div><div><label class="input-label" for="guess">你的猜测</label><div class="input-wrap"><input id="guess" type="number" inputmode="numeric" min="1" max="999" step="1" placeholder="— — —" disabled autocomplete="off"><span>BPM</span></div><button class="primary" id="action">开始挑战 →</button><div class="help" id="help" role="status">可在播放时提前提交</div></div><button class="secondary console-exit hidden" id="exit">退出挑战</button></section>

<div class="bottom"><span>人耳听音的硬核才是王道</span><span id="footnote">你那机测的节奏根本没技巧（）</span></div>
</main><footer><span>GUESS THE BPM / 节奏练习</span><span>建议佩戴耳机</span></footer>
<dialog id="info-dialog" aria-labelledby="info-title"><h2 id="info-title">什么是 BPM？</h2><p>BPM就是每分钟的节拍数量，玩家需要听鼓组来猜测BPM并填写。</p><form method="dialog"><button class="secondary">知道了</button></form></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id), modes={single:{count:1,seconds:30,name:'单次猜测'},four:{count:4,seconds:10,name:'四次猜测'},fast:{count:8,name:'恐怖本能'}};
let selected='single',state='idle',answers=[],tempos=[],round=0,ctx,master,noise,timer,raf,deadline=0,duration=0,nextBeat=0,beat=0,kitOrder=[],sources=new Set(),starting=false,visualBeats=[],transitionId=0;
const flashes=[...document.querySelectorAll('.beat-flashes i')];
const volumeStorageKey='guess-the-bpm.volume';
try{const saved=localStorage.getItem(volumeStorageKey);if(saved!==null&&saved.trim()!==''&&Number.isFinite(Number(saved))&&Number(saved)>=0&&Number(saved)<=100)$('volume').value=String(Number(saved));}catch{}

// Eight synthesis families, each with four tunings and accompaniment patterns.
const kitFamilies=['录音室原声','复古鼓机','深低音电子','木质敲击','手鼓沙锤','金属工业','刷奏爵士','街头拍手'];
const kits=kitFamilies.flatMap((name,family)=>Array.from({length:4},(_,variant)=>({name:name+' '+(variant+1),family,variant,tune:[.88,1,1.13,1.25][variant],kick:[52,48,40,66,70,46,57,55][family],decay:[.17,.23,.29,.09,.12,.11,.14,.15][family]})));
let lastFamily=-1;
function chooseKits(){const families=shuffle(kitFamilies.map((_,i)=>i));if(families[0]===lastFamily)[families[0],families[1]]=[families[1],families[0]];return families.map(f=>f*4+Math.floor(Math.random()*4));}
function randomBpm(){const r=Math.random()*100;const b=r<5?[80,99]:r<38?[100,149]:r<71?[150,199]:r<91?[200,249]:r<96?[250,299]:[300,350];return b[0]+Math.floor(Math.random()*(b[1]-b[0]+1));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
async function audio(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();const limiter=ctx.createDynamicsCompressor();master.connect(limiter);limiter.connect(ctx.destination);noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}master.gain.value=+$('volume').value/100*1.3;await ctx.resume();if(ctx.state!=='running')throw Error('audio unavailable');}
function track(s,g,t,len){sources.add(s);s.connect(g);g.connect(master);s.onended=()=>{sources.delete(s);s.disconnect();g.disconnect();};s.start(t);s.stop(t+len+.02);}
function tone(freq,end,type,t,len,level){const s=ctx.createOscillator(),g=ctx.createGain();s.type=type;s.frequency.setValueAtTime(freq,t);s.frequency.exponentialRampToValueAtTime(end,t+len);g.gain.setValueAtTime(level,t);g.gain.exponentialRampToValueAtTime(.0001,t+len);track(s,g,t,len);}
function hiss(freq,t,len,level){const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=noise;f.type='highpass';f.frequency.value=freq;s.connect(f);f.connect(g);g.gain.setValueAtTime(level,t);g.gain.exponentialRampToValueAtTime(.0001,t+len);g.connect(master);sources.add(s);s.onended=()=>{sources.delete(s);s.disconnect();f.disconnect();g.disconnect();};s.start(t);s.stop(t+len);}
function bandNoise(freq,q,t,len,level){const source=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();source.buffer=noise;filter.type='bandpass';filter.frequency.value=freq;filter.Q.value=q;source.connect(filter);filter.connect(gain);gain.connect(master);gain.gain.setValueAtTime(level,t);gain.gain.exponentialRampToValueAtTime(.0001,t+len);sources.add(source);source.onended=()=>{sources.delete(source);source.disconnect();filter.disconnect();gain.disconnect();};source.start(t);source.stop(t+len);}
function wood(freq,t,level){tone(freq,freq*.94,'sine',t,.045,level);tone(freq*2.37,freq*2.2,'sine',t,.024,level*.35);}
function metal(freq,t,level,len=.12){[1,1.47,2.09,2.63].forEach((ratio,i)=>tone(freq*ratio,freq*ratio*.98,'square',t,len/(1+i*.35),level/(8+i*4)));}
function clap(t,level){[0,.009,.021].forEach((offset,i)=>bandNoise(1400+i*320,.7,t+offset,i===2?.105:.018,level*(i===2?1:.7)));}
function drum(t,n){
 visualBeats.push({time:t,index:n%4});const k=kits[kitOrder[round]],first=n%4===0,back=n%2===1,v=k.variant,p=k.tune,bar=Math.floor(n/4),step=60/tempos[round];lastFamily=k.family;
 const level=first?.57:.32,low=k.kick*p; // A firm pulse on every beat in all families.
 tone(low*(k.family===2?3:2),low,'sine',t,Math.min(k.decay,step*.8),level);
 if(first){tone(low*1.5,low,'triangle',t,.06,.14);wood(760*p,t,.15);}
 switch(k.family){
 case 0: // Acoustic: shell resonance, snare wires, closed/open hats.
  hiss(7000,t,.035,.065);if(back){tone(185*p,125*p,'triangle',t,.07,.14);bandNoise(2100,.65,t,.115,.28);}if(n%8===6+v%2)tone(145*p,80*p,'sine',t,.12,.13);break;
 case 1: // Analog drum machine: long bass, dry rim, bright clap.
  metal(2900,t,.16,.025);if(back)clap(t,.18);if(n%4===2)wood(1150*p,t,.11);break;
 case 2: // Sub-heavy electronic: synthetic snare and short digital clicks.
  wood(1800*p,t,.07);if(back){tone(310*p,110*p,'triangle',t,.075,.15);bandNoise(3400,1.2,t,.065,.17);}if(n%4===2)metal(420*p,t,.13,.055);break;
 case 3: // Wood: alternating hollow blocks and muted conga-like bodies.
  wood((back?510:880)*p,t,first?.25:.18);tone((back?230:155)*p,110*p,'sine',t,.065,.13);if(n%4===3)wood(1320*p,t,.11);break;
 case 4: // Hand percussion: low/high skin tones, slap and shaker.
  tone((back?260:170)*p,(back?170:120)*p,'sine',t,.095,.22);bandNoise(back?1700:900,1.5,t,.035,back?.18:.08);hiss(5200,t,.055,.055);break;
 case 5: // Metallic: inharmonic struck plates and tight gated noise.
  metal((back?480:310)*p,t,first?.5:.3,.10);if(back)bandNoise(2600,2,t,.045,.15);wood(2100*p,t,.055);break;
 case 6: // Brushes: softer noise swishes, cross-stick and ride bell.
  bandNoise(4200,.4,t,.13,.11);if(back)wood(660*p,t,.17);else metal(1700*p,t,.15,.085);break;
 case 7: // Claps and stomp: layered hand claps, dry clicks and low body.
  if(back)clap(t,.27);else{wood(920*p,t,.13);bandNoise(780,.8,t,.045,.12);}hiss(6400,t,.025,.035);break;
 }
 // Quiet eighth-note ornaments vary by bar; no extra accents at high tempos.
 if(tempos[round]<=210&&(n+v+bar)%2===0){const at=t+step/2;if(at<deadline-.02){if(k.family===3||k.family===4)wood((620+v*95)*p,at,.045);else if(k.family===5)metal(720*p,at,.07,.035);else hiss(5500+v*650,at,.025,.025);}}
}
function stop(){clearInterval(timer);cancelAnimationFrame(raf);for(const s of sources){try{s.stop();}catch{}}sources.clear();visualBeats=[];flashes.forEach(el=>el.style.opacity=0);}
function lock(active){document.querySelectorAll('.mode').forEach(b=>b.disabled=active);$('exit').classList.toggle('hidden',!active);document.body.classList.toggle('guessing',active);document.querySelectorAll('header,.heading,.mode-label,.modes,.start-area,.bottom,footer').forEach(el=>el.inert=active);}
function error(msg){$('help').textContent=msg;$('help').classList.add('error');}
function select(mode){selected=mode;document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.mode===mode)));reset();}
function reset(){transitionId++;starting=false;stop();state='idle';$('start').disabled=false;$('start-area').classList.remove('hidden');$('start-help').textContent='';lock(false);$('results').classList.add('hidden');$('console').classList.add('hidden');$('guess').value='';$('guess').disabled=true;$('action').disabled=false;$('action').textContent='开始挑战 →';$('status').textContent='准备就绪';$('round').textContent='ROUND — / —';$('time').textContent=selected==='fast'?'8 拍':modes[selected].seconds+' 秒';$('detail').textContent=modes[selected].name;$('help').textContent=selected==='fast'?'每段播放后有 5 秒填写时间':'可在播放时提前提交';$('help').classList.remove('error');$('progress').style.width='0%';draw();}
async function start(){
 if(starting||state!=='idle')return;starting=true;state='entering';const id=++transitionId;$('start').disabled=true;lock(true);
 try{await audio();if(id!==transitionId)return;answers=[];tempos=[];while(tempos.length<modes[selected].count){const n=randomBpm();if(!tempos.includes(n))tempos.push(n);}kitOrder=chooseKits();round=0;
 $('console').classList.remove('hidden');$('guess').value='';$('guess').disabled=true;$('action').disabled=true;$('action').textContent=selected==='fast'?'聆听中…':selected==='four'?'下一轮 →':'确认答案 →';$('status').textContent='准备开始';$('round').textContent='ROUND 01 / '+String(modes[selected].count).padStart(2,'0');$('detail').textContent=modes[selected].name;draw();
 $('start-area').classList.add('hidden');play();
 }catch{if(id===transitionId){reset();$('start-help').textContent='音频无法启动，请检查浏览器音频权限后重试。';}}finally{if(id===transitionId)starting=false;}
}
function play(){stop();state='playing';$('guess').value='';$('guess').disabled=selected==='fast';$('help').classList.remove('error');$('help').textContent=selected==='fast'?'播放结束后开始填写':'可在播放时提前提交';$('action').textContent=selected==='fast'?'聆听中…':selected==='four'?(round<3?'下一轮 →':'提交并查看结果 →'):'确认答案 →';$('action').disabled=selected==='fast';$('status').textContent='正在播放';$('round').textContent=`ROUND ${String(round+1).padStart(2,'0')} / ${String(modes[selected].count).padStart(2,'0')}`;$('detail').textContent=selected==='fast'?'8 拍':'播放中';duration=selected==='fast'?8*60/tempos[round]:modes[selected].seconds;const leadIn=Math.max(.4,Math.min(.8,(ctx.baseLatency||0)+(ctx.outputLatency||0)+.2));const startAt=ctx.currentTime+leadIn;deadline=startAt+duration;nextBeat=startAt;beat=0;
// Queue the first bar synchronously: never rely on a UI timer for the opening beat.
while(beat<4&&nextBeat<deadline-.001){drum(nextBeat,beat++);nextBeat+=60/tempos[round];}
function schedule(){const now=ctx.currentTime;while(nextBeat<now+.5&&nextBeat<deadline-.001){drum(nextBeat,beat++);nextBeat+=60/tempos[round];}if(now>=deadline)listenEnd();}timer=setInterval(schedule,20);schedule();tick();draw();if(selected!=='fast'&&!matchMedia('(pointer: coarse)').matches)$('guess').focus({preventScroll:true});}
function tick(){cancelAnimationFrame(raf);if(state!=='playing'&&state!=='answering')return;const left=Math.min(duration,Math.max(0,deadline-ctx.currentTime));visualTick();$('time').textContent=selected==='fast'&&state==='playing'?'8 拍':left.toFixed(1)+' 秒';$('progress').style.width=selected==='fast'&&state==='playing'?'0%':Math.min(100,Math.max(0,(1-left/duration)*100))+'%';raf=requestAnimationFrame(tick);}
function visualTick(){
 let now=ctx.currentTime;
 if(ctx.getOutputTimestamp){const stamp=ctx.getOutputTimestamp();if(stamp.performanceTime>0)now=stamp.contextTime+(performance.now()-stamp.performanceTime)/1000;}
 visualBeats=visualBeats.filter(b=>now-b.time<.1);
 flashes.forEach((el,i)=>{const b=visualBeats.find(b=>b.index===i&&now>=b.time);el.style.opacity=b?Math.max(0,.6*(1-(now-b.time)/.1)):0;});
}
function listenEnd(){stop();if(selected==='fast'){state='answering';duration=5;deadline=ctx.currentTime+5;$('guess').disabled=false;$('status').textContent='填写答案';$('detail').textContent='倒计时结束自动提交';$('action').textContent='等待自动提交';$('help').textContent='未作答按 100% 误差计入';$('guess').focus({preventScroll:true});timer=setInterval(()=>{if(ctx.currentTime>=deadline)submit(true);},25);tick();}else{state='waiting';$('status').textContent='等待答案';$('time').textContent='播放结束';$('detail').textContent='填写后确认';$('progress').style.width='100%';}}
function submit(auto=false){if(!['playing','waiting','answering'].includes(state))return;const raw=$('guess').value,n=Number(raw),valid=raw!==''&&Number.isInteger(n)&&n>=1&&n<=999;if(!valid&&!auto){error('请输入 1–999 之间的整数 BPM。');$('guess').focus();return;}stop();answers.push(valid?n:null);$('guess').disabled=true;if(round+1===modes[selected].count){finish();return;}round++;play();}
function rating(avg){return avg<1?'SSS':avg<2?'SS':avg<4?'S':avg<8?'A':avg<=15?'B':'C';}
function finish(){state='results';lock(false);$('console').classList.add('hidden');$('results').classList.remove('hidden');const errors=answers.map((a,i)=>a===null?100:Math.abs(a-tempos[i])/tempos[i]*100),done=answers.filter(x=>x!==null);const avg=errors.reduce((a,b)=>a+b,0)/errors.length;
 $('result-title').textContent=modes[selected].name+' · 挑战结果';
 const grade=avg===null?'—':rating(avg);$('grade').textContent=grade;$('grade').className='grade'+(grade==='SSS'?' gold':grade==='SS'?' silver':'');$('grade').setAttribute('aria-label','评级 '+grade);

 $('score').textContent='';const s=document.createElement('span');s.textContent=avg.toFixed(2)+'%';const small=document.createElement('small');small.textContent=`平均误差 · 已答 ${done.length}/${answers.length}`;$('score').append(s,small);$('rows').replaceChildren();answers.forEach((a,i)=>{const tr=document.createElement('tr');[String(i+1).padStart(2,'0'),a===null?'未作答':a,tempos[i],errors[i].toFixed(2)+'%',a===null?'—':a===tempos[i]?'准确':(a>tempos[i]?'偏高 +':'偏低 ')+(a-tempos[i])].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td);});$('rows').append(tr);});$('result-title').focus({preventScroll:true});}
function draw(){const c=$('wave'),r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;const g=c.getContext('2d');g.scale(dpr,dpr);const w=r.width,h=r.height;g.strokeStyle='#203449';g.lineWidth=1;for(let y=16;y<h;y+=24){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();}g.strokeStyle=state==='idle'?'#388cdc':'#284c70';g.beginPath();for(let x=0;x<w;x++){const p=x/w;const envelope=Math.exp(-p*5)*.8+.025;const y=h/2+Math.sin(p*160)*Math.cos(p*39)*envelope*h*.42;if(x===0)g.moveTo(x,y);else g.lineTo(x,y);}g.stroke();}
$('start').addEventListener('click',start);
$('action').addEventListener('click',()=>{if(selected!=='fast'&&(state==='playing'||state==='waiting'))submit();});
$('guess').addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;e.preventDefault();e.stopPropagation();if(e.repeat)return;if(selected!=='fast'&&(state==='playing'||state==='waiting'))submit();});
$('info').addEventListener('click',()=>$('info-dialog').showModal());
$('info-dialog').addEventListener('click',e=>{if(e.target===$('info-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
$('guess').addEventListener('input',()=>{$('help').classList.remove('error');});
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>select(b.dataset.mode)));
$('volume').addEventListener('input',()=>{try{localStorage.setItem(volumeStorageKey,$('volume').value);}catch{}if(master)master.gain.setTargetAtTime(+$('volume').value/100*1.3,ctx.currentTime,.02);});$('exit').addEventListener('click',reset);$('again').addEventListener('click',()=>{reset();start();});window.addEventListener('resize',draw);window.addEventListener('pagehide',stop);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&['entering','playing','answering','waiting','leaving'].includes(state)){reset();$('start-help').textContent='挑战已退出：页面切换会中断播放，请重新开始。';}});
reset();
</script>
</body>
